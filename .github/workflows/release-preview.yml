name: DocPilot - PDF Reader | Release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36 and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Configure production signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          configured=0
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done

          if [[ "$configured" -eq 4 ]]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/docpilot-release.jks"
            test -s "$RUNNER_TEMP/docpilot-release.jks"
            echo "production=true" >> "$GITHUB_OUTPUT"
            echo "mode=Persistent production keystore" >> "$GITHUB_OUTPUT"
            echo "Production signing is configured."
          elif [[ "$configured" -eq 0 ]]; then
            echo "production=false" >> "$GITHUB_OUTPUT"
            echo "mode=Debug signing for CI validation only" >> "$GITHUB_OUTPUT"
            echo "::warning::The four production signing secrets are not configured. The build will be validated, but no GitHub Release will be published."
          else
            echo "::error::Configure all four signing secrets together: SIGNING_KEYSTORE_BASE64, SIGNING_KEYSTORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD."
            exit 1
          fi

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/docpilot-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK artifact
        run: cp app/build/outputs/apk/release/app-release.apk DocPilot-PDF-Reader-0.1.7.apk

      - name: Upload APK for validation
        uses: actions/upload-artifact@v4
        with:
          name: docpilot-pdf-reader-v0.1.7-${{ steps.signing.outputs.production == 'true' && 'production-signed' || 'debug-signed-ci-only' }}
          path: DocPilot-PDF-Reader-0.1.7.apk
          retention-days: 90

      - name: Publish GitHub Release
        if: steps.signing.outputs.production == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.7-preview.1
          target_commitish: ${{ github.sha }}
          name: DocPilot - PDF Reader 0.1.7
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            ## DocPilot - PDF Reader 0.1.7

            This Android APK is published only after unit tests, release assembly and APK signature verification pass.

            Signing: this release uses the persistent production keystore supplied through the four protected GitHub Actions secrets. Preserve that keystore for every future app update.

            Branding and build:
            - Android app label and Home, navigation and Settings branding updated to DocPilot - PDF Reader
            - Refreshed blue-violet document launcher icon
            - Version 0.1.7 (versionCode 8)
            - Existing Android application ID preserved as com.nexauren.docpilot to retain update compatibility

            Included PDF tools:
            - PDF reader with inline search, page navigation, saved reading position, bookmarks, zoom and reading progress
            - Dashboard, library and tool search
            - PDF merge, split, page reorder, 90-degree rotation and image compression
            - Export selectable PDF text, scanner, image OCR and images-to-PDF conversion
            - Password protection and visual text signatures

            Storage permission note: Android 11+ may require all-files access for automatic device-wide PDF discovery. Individual PDF opening remains available as a fallback.
          files: DocPilot-PDF-Reader-0.1.7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
