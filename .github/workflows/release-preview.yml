name: DocPilot Installable Preview Release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36 and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare release asset
        run: cp app/build/outputs/apk/release/app-release.apk DocPilot-0.1.6-preview.apk

      - name: Upload exact release APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: docpilot-release-apk-v0.1.6-preview.1
          path: DocPilot-0.1.6-preview.apk
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.6-preview.1
          target_commitish: ${{ github.sha }}
          name: DocPilot 0.1.6 — Installable Preview
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            ## DocPilot 0.1.6 — Installable Android Preview

            This APK is built by GitHub Actions only after unit tests, release assembly and APK signature verification pass.

            **Signing notice:** this preview uses the default Android debug signing identity for device testing. It is not the permanent production signing key and must not be used for a stable store launch. A persistent production keystore must be configured before publishing a production release.

            ### Included
            - PDF reader with live inline text search, reflow mode, page jump, saved position, page bookmarks, zoom and reading progress
            - Dashboard, library and tool search that filters results in place rather than opening a separate search screen
            - Sidebar navigation menu with animated transitions and distinct tool visuals
            - PDF merge, split, page reorder, 90-degree rotation and image compression
            - Export selectable PDF text to a TXT file, document scanning, image OCR and images-to-PDF conversion
            - Per-tool processing panels and animated loading states
            - Password protection and visual text signatures

            **Storage permission note:** Android 11+ requires the user to enable all-files access in system settings to build the automatic device-wide PDF library. Opening an individual PDF remains available as a fallback. Google Play distribution requires a separate permission-policy review.
          files: DocPilot-0.1.6-preview.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
