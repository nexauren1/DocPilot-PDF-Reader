name: DocPilot - PDF Reader | Release

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-preview.yml"
      - "app/build.gradle.kts"
      - "build.gradle.kts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read app version
        id: version
        shell: bash
        run: |
          VERSION_NAME="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Preparing DocPilot $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36 and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Configure production signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          configured=0
          for value in "$KEYSTORE_BASE64" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done

          if [[ "$configured" -ne 4 ]]; then
            echo "::error::Release blocked. Production signing is not configured. Review the protected build settings."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/docpilot-release.jks"
          test -s "$RUNNER_TEMP/docpilot-release.jks"
          echo "production=true" >> "$GITHUB_OUTPUT"
          echo "mode=Persistent production keystore" >> "$GITHUB_OUTPUT"
          echo "All four production signing secrets are configured."

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/docpilot-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Prepare APK artifact
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: cp app/build/outputs/apk/release/app-release.apk "DocPilot-PDF-Reader-${VERSION_NAME}.apk"

      - name: Upload APK for validation
        uses: actions/upload-artifact@v4
        with:
          name: docpilot-pdf-reader-v${{ steps.version.outputs.name }}-${{ steps.signing.outputs.production == 'true' && 'production-signed' || 'debug-signed-ci-only' }}
          path: DocPilot-PDF-Reader-${{ steps.version.outputs.name }}.apk
          retention-days: 90

      - name: Publish GitHub Release
        if: steps.signing.outputs.production == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-preview.1
          target_commitish: ${{ github.sha }}
          name: DocPilot - PDF Reader ${{ steps.version.outputs.name }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            ## DocPilot - PDF Reader ${{ steps.version.outputs.name }}

            This Android APK is published only after unit tests, release assembly and APK signature verification pass.

            Signing: this release uses the persistent protected production signing configuration. Preserve the signing key for every future app update.

            Build:
            - Version ${{ steps.version.outputs.name }} (versionCode ${{ steps.version.outputs.code }})
            - Existing Android application ID preserved as com.nexauren.docpilot
            - Professional PDF and text tool workflow: configure, process, preview and save

            Storage permission note: Android 11+ may require all-files access for automatic device-wide PDF discovery. Individual PDF opening remains available as a fallback.
          files: DocPilot-PDF-Reader-${{ steps.version.outputs.name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
