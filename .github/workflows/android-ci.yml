name: Android CI - DocPilot PDF Reader

on:
  push:
    branches: ["main", "foundation"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Run unit tests
        run: gradle test --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Verify release APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: docpilot-pdf-reader-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: docpilot-pdf-reader-release-build
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish installable preview to GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          TAG="v${VERSION_NAME}-preview.1"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping duplicate publication."
            exit 0
          fi

          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk             --repo "$GITHUB_REPOSITORY"             --title "DocPilot - PDF Reader ${VERSION_NAME} Preview"             --notes "Installable preview for DocPilot - PDF Reader ${VERSION_NAME}. Built from main after unit tests and APK signature verification. This preview may use Android debug signing if the four protected production-signing values are not configured. If a previous version is installed with a different signing key, uninstall it before installing this preview. Do not distribute this as a production store build until the persistent production keystore is configured and verified."             --prerelease
